<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory V5.1 - Final Fit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            @page { size: A4; margin: 0; }
            html, body { margin: 0; padding: 0; background: #fff; }
            .no-print { display: none !important; }
            
            .report-page { 
                /* 关键修复：高度缩减到 265mm，留出巨大空隙给系统水印 */
                height: 265mm !important; 
                width: 210mm !important;
                padding: 10mm 15mm 25mm 15mm !important; /* 底部预留 25mm 缓冲区 */
                margin: 0 !important;
                page-break-after: always !important;
                page-break-inside: avoid !important;
                display: flex !important;
                flex-direction: column !important;
                box-sizing: border-box !important;
                overflow: hidden !important; 
            }
        }
        
        .report-page { background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin: 20px auto; padding: 15mm 15mm; width: 210mm; min-height: 297mm; display: flex; flex-direction: column; }
        .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; flex-grow: 1; align-content: start; }
        .photo-container { border: 1px solid #f1f5f9; padding: 5px; background: #fff; }
        .photo-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; background: #f8fafc; }
        .label-input { width: 100%; margin-top: 5px; border: none; border-bottom: 1px solid #e2e8f0; text-align: center; font-size: 11px; padding: 2px 0; outline: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <div class="no-print max-w-xl mx-auto p-6 mt-10 bg-white rounded-3xl shadow-2xl border border-slate-100 text-center">
        <h1 class="text-xl font-black text-slate-800 tracking-tighter uppercase mb-6">Inventory <span class="text-blue-600">v5.1</span></h1>
        
        <div class="grid grid-cols-2 gap-3 mb-4">
            <input type="text" id="project" placeholder="Project Name" class="bg-slate-50 rounded-xl px-4 py-3 outline-none text-sm w-full">
            <input type="text" id="unit" placeholder="Unit No." class="bg-slate-50 rounded-xl px-4 py-3 outline-none text-sm w-full">
        </div>
        <input type="date" id="date" class="w-full bg-slate-50 rounded-xl px-4 py-3 outline-none text-sm mb-6">

        <div id="dropZone" class="border-2 border-dashed border-slate-200 rounded-2xl p-10 text-center cursor-pointer hover:bg-blue-50 transition-all mb-8">
            <p class="text-xs font-black text-slate-400 uppercase tracking-widest">Select Photos</p>
            <p id="counter" class="text-[10px] text-blue-500 font-bold mt-2 uppercase">Alignment Locked</p>
            <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button onclick="generateReport()" class="bg-slate-900 text-white py-4 rounded-2xl font-bold text-xs uppercase tracking-widest shadow-lg">1. Preview</button>
            <button onclick="window.print()" class="bg-blue-600 text-white py-4 rounded-2xl font-bold text-xs uppercase tracking-widest shadow-lg">2. Save PDF</button>
        </div>
    </div>

    <div id="mainReport" class="flex flex-col items-center"></div>

    <script>
        let photos = [];
        document.getElementById('date').valueAsDate = new Date();
        const fileInput = document.getElementById('fileInput');
        document.getElementById('dropZone').onclick = () => fileInput.click();

        fileInput.onchange = async (e) => {
            const selectedFiles = Array.from(e.target.files);
            for (let file of selectedFiles) {
                const dataUrl = await turboCompress(file);
                photos.push({ src: dataUrl, label: '' });
            }
            document.getElementById('counter').innerText = `${photos.length} Photos Ready`;
            generateReport();
        };

        function turboCompress(file) {
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const TARGET_WIDTH = 800; 
                        const scale = TARGET_WIDTH / img.width;
                        canvas.width = TARGET_WIDTH;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.35)); 
                    }
                }
            });
        }

        function generateReport() {
            const container = document.getElementById('mainReport');
            container.innerHTML = '';
            const proj = document.getElementById('project').value || 'INVENTORY';
            const unit = document.getElementById('unit').value || '-';
            const dateStr = document.getElementById('date').value;

            for (let i = 0; i < photos.length; i += 6) {
                const page = document.createElement('div');
                page.className = 'report-page';
                let html = `
                    <div class="flex justify-between items-end border-b-2 border-slate-900 pb-2 mb-4">
                        <div>
                            <h1 class="text-lg font-black uppercase leading-none mb-1">${proj}</h1>
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Unit: ${unit}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[8px] font-black text-blue-600 uppercase mb-0.5 tracking-tighter">Inventory Record</p>
                            <p class="text-[10px] font-bold text-slate-900">${dateStr}</p>
                        </div>
                    </div>
                    <div class="photo-grid">
                `;
                for (let j = i; j < i + 6 && j < photos.length; j++) {
                    html += `
                        <div class="photo-container">
                            <img src="${photos[j].src}" class="photo-img">
                            <input type="text" placeholder="Remark..." value="${photos[j].label}" class="label-input" oninput="photos[${j}].label=this.value">
                        </div>
                    `;
                }
                html += `</div>
                    <div class="mt-auto flex justify-between items-center text-[8px] text-slate-300 font-bold uppercase tracking-widest border-t border-slate-100 pt-2">
                        <span>Dreamvest Realty</span>
                        <span>Page ${Math.floor(i/6) + 1} of ${Math.ceil(photos.length/6)}</span>
                    </div>
                `;
                page.innerHTML = html;
                container.appendChild(page);
            }
        }
    </script>
</body>
</html>
